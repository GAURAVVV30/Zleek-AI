          application/json:
            schema:
              type: object
  /v1/remediation/generate:
    post:
      summary: Remediation Generation
      operationId: post_v1_remediation_generate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /v1/health:
    get:
      summary: Health check endpoint
      operationId: get_v1_health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
