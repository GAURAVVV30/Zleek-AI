                  token:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      security: []
  /auth/logout:
    post:
      summary: Logout
      operationId: post_auth_logout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
