openapi: 3.0.3
info:
  title: Learning Platform Go API
  version: 1.0.0
  description: API for the Go Platform Service (Frontend -> Go)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
    LearnerProfile:
      type: object
      properties:
        time_availability:
          type: string
        format_preference:
          type: string
        prior_experience:
          type: string
    Goal:
      type: object
      properties:
        id:
          type: string
        goal_text:
          type: string
        knowledge_structure_id:
          type: string
        status:
          type: string
        achieved_at:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
security:
  - bearerAuth: []
paths:
  /auth/signup:
    post:
      summary: Register new learner
      operationId: post_auth_signup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      security: []
  /auth/login:
    post:
      summary: Login
      operationId: post_auth_login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      security: []
  /auth/refresh:
    post:
      summary: Refresh token
      operationId: post_auth_refresh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
